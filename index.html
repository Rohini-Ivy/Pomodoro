<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus Timer & Analytics</title>
    <style>
        :root {
            --bg-work: linear-gradient(135deg, #1e1b4b, #31103f);
            --bg-short: linear-gradient(135deg, #064e3b, #022c22);
            --bg-long: linear-gradient(135deg, #1e3a8a, #172554);
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-color: #ffffff;
            --accent-color: #f43f5e;
            --btn-hover: #e11d48;
            --sub-bg: rgba(0, 0, 0, 0.25);
            --input-border: rgba(255, 255, 255, 0.15);
        }

        /* Light Theme Palette Overrides */
        body.light-theme {
            --bg-work: linear-gradient(135deg, #e0e7ff, #f3e8ff);
            --bg-short: linear-gradient(135deg, #d1fae5, #a7f3d0);
            --bg-long: linear-gradient(135deg, #dbeafe, #bfdbfe);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #1f2937;
            --accent-color: #e11d48;
            --btn-hover: #be123c;
            --sub-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-work);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease, color 0.3s ease;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            transition: background 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 0.3px;
        }

        .header-btns {
            display: flex;
            gap: 6px;
        }

        /* Utility Buttons (PiP & Theme Toggle) */
        .icon-btn {
            background: var(--sub-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            opacity: 0.8;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            background: var(--sub-bg);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 18px;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 7px 0;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Timer Display Container */

#floatingTimerBox {
    background: var(--sub-bg);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    margin-bottom: 10px;
    border: 1px solid var(--input-border);
}

.timer-display {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -1px;
}

.timer-mode-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    opacity: 0.7;
    margin-bottom: 2px;
}

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 11px 0;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--sub-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover {
            opacity: 0.8;
        }

        /* Analytics Dashboard Box */
        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: var(--sub-bg);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 18px;
            text-align: center;
            border: 1px solid var(--input-border);
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.65rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Task Manager Section */
        .task-section {
            border-top: 1px solid var(--input-border);
            padding-top: 15px;
        }

        .task-section h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .task-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .task-input {
            flex: 1;
            background: var(--sub-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
        }

        .task-input::placeholder {
            opacity: 0.5;
            color: var(--text-color);
        }

        .add-task-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-task-btn:hover {
            background: #059669;
        }

        .task-list {
            list-style: none;
            max-height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--sub-bg);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .task-item.completed span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            word-break: break-all;
        }

        .task-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #10b981;
        }

        .delete-task-btn {
            background: transparent;
            border: none;
            opacity: 0.5;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 4px;
            color: var(--text-color);
            transition: opacity 0.2s;
        }

        .delete-task-btn:hover {
            opacity: 1;
            color: #f43f5e;
        }
        .keyboard-hint {
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.5;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🍅 Pomodoro Timer</h1>
            <div class="header-btns">
                <button class="icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">☀️</button>
                <button class="icon-btn" id="pipBtn" title="Pop out floating mini timer">📌 Float</button>
            </div>
        </header>

        <!-- Mode Selection Tabs -->
        <div class="mode-tabs">
            <button class="mode-btn active" data-mode="work">Work (25m)</button>
            <button class="mode-btn" data-mode="shortBreak">Short Break (5m)</button>
            <button class="mode-btn" data-mode="longBreak">Long Break (15m)</button>
        </div>

        <!-- Floating Timer Box -->
        <div id="floatingTimerBox">
            <div class="timer-mode-label" id="modeLabel">Work Session</div>
            <div class="timer-display" id="timer">25:00</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn" id="startBtn">Start</button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <div class="keyboard-hint">Shortcuts: [Space] Start/Pause | [R] Reset | [S] Skip</div>


        <!-- Analytics Dashboard Box -->
        <div class="stats-dashboard">
            <div class="stat-card">
                <span class="stat-value" id="statSessions">0</span>
                <span class="stat-label">Sessions</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statMinutes">0m</span>
                <span class="stat-label">Focus Time</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statStreak">0 Days</span>
                <span class="stat-label">Streak</span>
            </div>
        </div>

        <!-- Task Manager -->
        <div class="task-section">
            <h3>Tasks for Today</h3>
            <form class="task-input-group" id="taskForm">
                <input type="text" class="task-input" id="taskInput" placeholder="Add a new focus task..." required>
                <button type="submit" class="add-task-btn">Add</button>
            </form>
            <ul class="task-list" id="taskList"></ul>
        </div>
    </div>

    <script>
        const times = {
            work: 25 * 60,
            shortBreak: 5 * 60,
            longBreak: 15 * 60
        };

        let currentMode = 'work';
        let timeLeft = times[currentMode];
        let timerId = null;
        let isRunning = false;

        // Theme Setup from localStorage
        const savedTheme = localStorage.getItem('pomodoro_theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeToggleBtn').textContent = '🌙';
        }

        // Theme Toggle Functionality
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            themeToggleBtn.textContent = isLight ? '🌙' : '☀️';
            localStorage.setItem('pomodoro_theme', isLight ? 'light' : 'dark');
        });

        let stats = JSON.parse(localStorage.getItem('pomodoro_stats')) || {
            sessions: 0,
            minutes: 0,
            streak: 0,
            lastActiveDate: null
        };

        const todayStr = new Date().toDateString();
        if (stats.lastActiveDate !== todayStr && stats.lastActiveDate) {
            const lastDate = new Date(stats.lastActiveDate);
            const currentDate = new Date(todayStr);
            const diffTime = Math.abs(currentDate - lastDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays > 1) {
                stats.streak = 0;
            }
        }

        // DOM Elements
        const timerDisplay = document.getElementById('timer');
        const modeLabel = document.getElementById('modeLabel');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const body = document.body;
        const pipBtn = document.getElementById('pipBtn');
        const floatingTimerBox = document.getElementById('floatingTimerBox');

        const statSessions = document.getElementById('statSessions');
        const statMinutes = document.getElementById('statMinutes');
        const statStreak = document.getElementById('statStreak');

        // Task Elements
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        let tasks = JSON.parse(localStorage.getItem('pomodoro_tasks')) || [];

        function updateStatsUI() {
            statSessions.textContent = stats.sessions;
            statMinutes.textContent = `${stats.minutes}m`;
            statStreak.textContent = `${stats.streak} Days`;
        }

        function saveStats() {
            localStorage.setItem('pomodoro_stats', JSON.stringify(stats));
            updateStatsUI();
        }

        function playAudioAlert() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log("Audio alert failed", e);
            }
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timerDisplay.textContent = formattedTime;
            document.title = `(${formattedTime}) Pomodoro Timer`;
        }

        function switchMode(mode) {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = 'Start';
            currentMode = mode;
            timeLeft = times[mode];

            modeBtns.forEach(btn => {
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (mode === 'work') {
                modeLabel.textContent = 'Work Session';
            } else if (mode === 'shortBreak') {
                modeLabel.textContent = 'Short Break';
            } else if (mode === 'longBreak') {
                modeLabel.textContent = 'Long Break';
            }

            updateDisplay();
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                switchMode(btn.dataset.mode);
            });
        });

        function timerTick() {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'Start';
                playAudioAlert();

                if (currentMode === 'work') {
                    stats.sessions++;
                    stats.minutes += 25;
                    
                    if (stats.lastActiveDate !== todayStr) {
                        stats.streak = stats.streak === 0 ? 1 : stats.streak + 1;
                        stats.lastActiveDate = todayStr;
                    }
                    saveStats();

                    if (stats.sessions % 4 === 0) {
                        switchMode('longBreak');
                    } else {
                        switchMode('shortBreak');
                    }
                } else {
                    switchMode('work');
                }
            }
        }
function handleTimerAction() {
            if (!isRunning) {
                timerId = setInterval(timerTick, 1000);
                isRunning = true;
                startBtn.textContent = 'Pause';
            } else {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = 'Resume';
            }
        }

        function handleTimerReset() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = 'Start';
            timeLeft = times[currentMode];
            updateDisplay();
        }

        function handleTimerSkip() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.textContent = 'Start';
            if (currentMode === 'work') {
                switchMode('shortBreak');
            } else {
                switchMode('work');
            }
        }

        startBtn.addEventListener('click', handleTimerAction);
        resetBtn.addEventListener('click', handleTimerReset);

        // --- Keyboard Shortcuts Listeners ---
        window.addEventListener('keydown', (e) => {
            // Do not trigger shortcuts if user is typing in the task input box
            if (document.activeElement === taskInput) return;

            if (e.code === 'Space') {
                e.preventDefault(); // Prevent page scrolling down on Space
                handleTimerAction();
            } else if (e.code === 'KeyR') {
                handleTimerReset();
            } else if (e.code === 'KeyS') {
                handleTimerSkip();
            }
        });

        // Floating PiP Feature
        pipBtn.addEventListener('click', async () => {
            try {
                if (!('documentPictureInPicture' in window)) {
                    alert('Floating window is not supported in your browser. Try Google Chrome or Microsoft Edge.');
                    return;
                }

                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 260,
                    height: 150
                });

                [...document.styleSheets].forEach((styleSheet) => {
                    try {
                        const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                        const style = pipWindow.document.createElement('style');
                        style.textContent = cssRules;
                        pipWindow.document.head.appendChild(style);
                    } catch (e) {
                        const link = pipWindow.document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = styleSheet.href;
                        pipWindow.document.head.appendChild(link);
                    }
                });

                pipWindow.document.body.className = document.body.className;
                pipWindow.document.body.style.margin = '0';
                pipWindow.document.body.style.display = 'flex';
                pipWindow.document.body.style.justifyContent = 'center';
                pipWindow.document.body.style.alignItems = 'center';
                pipWindow.document.body.style.background = 'var(--bg-work)';

                pipWindow.document.body.appendChild(floatingTimerBox);

                pipWindow.addEventListener('unload', () => {
                    document.body.querySelector('.container').insertBefore(floatingTimerBox, document.querySelector('.controls'));
                });
            } catch (err) {
                console.error(err);
            }
        });

        // Task Management
        function saveAndRenderTasks() {
            localStorage.setItem('pomodoro_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            taskList.innerHTML = '';
            if (tasks.length === 0) {
                taskList.innerHTML = '<li style="text-align: center; opacity: 0.4; font-size: 0.85rem; padding: 10px;">No tasks yet. Add one below!</li>';
                return;
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${index})">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${index})">
                        <span>${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-task-btn" onclick="deleteTask(${index})" title="Delete task">&times;</button>
                `;
                taskList.appendChild(li);
            });
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveAndRenderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveAndRenderTasks();
        }

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text: text, completed: false });
                taskInput.value = '';
                saveAndRenderTasks();
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize App
        updateDisplay();
        updateStatsUI();
        renderTasks();
    </script>
</body>
</html>
